name: LG Vehicles Report
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Generates a vehicle movement report for Lion Guardians in the Amboseli ecosystem from the EarthRanger Vehicles subject group, producing speed and track maps, speed-over-time charts, and speed and distance statistics per vehicle, on an interactive dashboard and in a Word report.
theory: "Vehicle GPS observations are converted to relocations and trajectory segments, and segments with unrealistic length, duration, or speed (outside 3 to 150 km/h by default) are dropped to remove GPS noise. Segment speeds are classified into 6 equal-interval bins for the speed map, and mean, minimum, and maximum speed and total distance covered are summarised per vehicle."
output_comment: "Outputs a dashboard with mean, minimum, and maximum speed and distance covered widgets, a speed map and a vehicle tracks map over EarthRanger conservancy and group ranch boundaries, and a speed-over-time line chart. Also writes cleaned relocations and trajectories (GeoParquet), HTML and PNG copies of each vehicle's maps and chart, a speed and distance summary CSV per vehicle, and a Word report (overall_report.docx) with a cover page and one section per vehicle."
